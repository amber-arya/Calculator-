<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f8f7f4" />
  <title>Calculator</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="wrapper">

    <!-- Calculator Card -->
    <div class="card">

      <!-- Display -->
      <section class="display">
        <p class="display__expr" id="expr"></p>
        <p class="display__value" id="display">0</p>
      </section>

      <!-- Buttons -->
      <div class="grid">

        <!-- Row 1 -->
        <button class="btn btn--clear"  data-action="clear">AC</button>
        <button class="btn btn--util"   data-action="back">⌫</button>
        <button class="btn btn--op"     data-op="%">%</button>
        <button class="btn btn--op"     data-op="/">÷</button>

        <!-- Row 2 -->
        <button class="btn" data-digit="7">7</button>
        <button class="btn" data-digit="8">8</button>
        <button class="btn" data-digit="9">9</button>
        <button class="btn btn--op"     data-op="*">×</button>

        <!-- Row 3 -->
        <button class="btn" data-digit="4">4</button>
        <button class="btn" data-digit="5">5</button>
        <button class="btn" data-digit="6">6</button>
        <button class="btn btn--op"     data-op="-">−</button>

        <!-- Row 4 -->
        <button class="btn" data-digit="1">1</button>
        <button class="btn" data-digit="2">2</button>
        <button class="btn" data-digit="3">3</button>
        <button class="btn btn--op"     data-op="+">+</button>

        <!-- Row 5 -->
        <button class="btn btn--zero"   data-digit="0">0</button>
        <button class="btn"             data-digit=".">.</button>
        <button class="btn btn--eq"     data-action="equals">=</button>

      </div>

    </div>

  </main>

  <!-- External JS -->
  <script src="script.js"></script>

</body>
</html>
